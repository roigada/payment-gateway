services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paymentgateway
      POSTGRES_PASSWORD: paymentgateway
      POSTGRES_USER: paymentgateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paymentgateway -d paymentgateway"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://paymentgateway:paymentgateway@postgres:5432/paymentgateway?sslmode=disable
      - up

  paymentgateway:
    image: golang:1.26-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ADDR: :8080
      AUTHORIZATION_FINGERPRINT_SECRET: dev-secret
      DATABASE_URL: postgres://paymentgateway:paymentgateway@postgres:5432/paymentgateway?sslmode=disable
      MOCK_BANK_BASE_URL: http://mock-bank:8080
    ports:
      - "8080:8080"
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: go run ./cmd/paymentgateway

volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:
