services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_PASSWORD: payment_gateway
      POSTGRES_USER: payment_gateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_gateway -d payment_gateway"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://payment_gateway:payment_gateway@postgres:5432/payment_gateway?sslmode=disable
      - up

  payment-gateway:
    image: golang:1.26.1-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ADDR: :8080
      FINGERPRINT_SECRET: local-development-secret
      DATABASE_URL: postgres://payment_gateway:payment_gateway@postgres:5432/payment_gateway?sslmode=disable
      MOCK_BANK_BASE_URL: http://mock-bank:9090
    ports:
      - "8080:8080"
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: go run ./cmd/payment-gateway

volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:
