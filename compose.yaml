services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskapi
      POSTGRES_PASSWORD: taskapi
      POSTGRES_USER: taskapi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapi -d taskapi"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://taskapi:taskapi@postgres:5432/taskapi?sslmode=disable
      - up

  taskapi:
    image: golang:1.25-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ADDR: :8080
      DATABASE_URL: postgres://taskapi:taskapi@postgres:5432/taskapi?sslmode=disable
    ports:
      - "8080:8080"
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: go run ./cmd/taskapi

volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:
