services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_PASSWORD: payment_gateway
      POSTGRES_USER: payment_gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_gateway -d payment_gateway"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./gateway/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://payment_gateway:payment_gateway@postgres:5432/payment_gateway?sslmode=disable
      - up

  mock-bank-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mockbank
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mockbank"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - mock-bank-postgres-data:/var/lib/postgresql/data

  mock-bank:
    build:
      context: ./mock-bank
      dockerfile: docker/bank-api/Dockerfile
    depends_on:
      mock-bank-postgres:
        condition: service_healthy
    entrypoint: ["/docker-entrypoint.sh", "air", "-c", ".air.toml"]
    environment:
      AUTH_EXPIRY_HOURS: 168
      DB_HOST: mock-bank-postgres
      DB_NAME: mockbank
      DB_PASSWORD: postgres
      DB_PORT: 5432
      DB_SSLMODE: disable
      DB_USER: postgres
      FAILURE_RATE: 0.05
      LOG_LEVEL: info
      MAX_LATENCY_MS: 0
      MIN_LATENCY_MS: 0
      PORT: 9090
    ports:
      - "${MOCK_BANK_PORT:-8787}:9090"
    working_dir: /app
    volumes:
      - ./mock-bank/bank:/app
      - mock-bank-air-tmp:/app/tmp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  payment-gateway:
    image: golang:1.26.1-alpine
    stop_grace_period: 35s
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-bank:
        condition: service_healthy
    environment:
      ADDR: :8080
      METRICS_ADDR: :9091
      # The gateway validates these at startup. Empty interpolation keeps
      # `docker compose logs` and `down` usable when local secrets are absent.
      FINGERPRINT_SECRET: ${FINGERPRINT_SECRET:-}
      SERVICE_CREDENTIAL_HMAC_KEY: ${SERVICE_CREDENTIAL_HMAC_KEY:-}
      ORDER_SERVICE_CREDENTIALS: ${ORDER_SERVICE_CREDENTIALS:-}
      DATABASE_URL: postgres://payment_gateway:payment_gateway@postgres:5432/payment_gateway?sslmode=disable
      DATABASE_MAX_OPEN_CONNECTIONS: 10
      DATABASE_MAX_IDLE_CONNECTIONS: 5
      DATABASE_CONNECTION_MAX_LIFETIME: 30m
      DATABASE_CONNECTION_MAX_IDLE_TIME: 5m
      DATABASE_STARTUP_TIMEOUT: 5s
      IDEMPOTENCY_CLAIM_STUCK_AFTER: 5m
      IDEMPOTENCY_REPLAY_CLEANUP_INTERVAL: 1h
      SHUTDOWN_TIMEOUT: 30s
      LOG_LEVEL: info
      MOCK_BANK_BASE_URL: http://mock-bank:9090
      MOCK_BANK_TIMEOUT: 7s
      MOCK_BANK_CONNECT_TIMEOUT: 2s
      MOCK_BANK_TLS_HANDSHAKE_TIMEOUT: 2s
      MOCK_BANK_RESPONSE_HEADER_TIMEOUT: 6s
      MOCK_BANK_IDLE_CONNECTION_TIMEOUT: 60s
      PAYMENT_COMMAND_TIMEOUT: 10s
      PAYMENT_READ_TIMEOUT: 3s
      HTTP_READ_HEADER_TIMEOUT: 5s
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s
      METRICS_READ_HEADER_TIMEOUT: 5s
      METRICS_READ_TIMEOUT: 5s
      METRICS_WRITE_TIMEOUT: 10s
      METRICS_IDLE_TIMEOUT: 30s
      HTTP_MAX_REQUEST_BODY_BYTES: 65536
    ports:
      - "8080:8080"
    working_dir: /app
    volumes:
      - ./gateway:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: go run ./cmd/payment-gateway

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.3.0
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-payment-gateway}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  mock-bank-postgres-data:
  mock-bank-air-tmp:
  go-mod-cache:
  go-build-cache:
  prometheus-data:
  grafana-data:
