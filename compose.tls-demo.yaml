services:
  payment-gateway:
    ports: !reset []

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      payment-gateway:
        condition: service_started
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
