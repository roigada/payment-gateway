services:
  mock-bank:
    ports: !override
      - "${IMAGE_SMOKE_MOCK_BANK_PORT:-18787}:9090"

  payment-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: payment-gateway:image-smoke
    command: ["/payment-gateway"]
    working_dir: /
    ports: !override
      - "${IMAGE_SMOKE_GATEWAY_PORT:-18080}:8080"
    volumes: !reset []
