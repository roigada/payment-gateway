name: Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway-tests:
    name: Gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Run gateway test suite
        run: go test ./...

  gateway-vet:
    name: Gateway vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Run Go vet
        run: go vet ./...

  gateway-vulnerability-check:
    name: Gateway vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: gateway
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
          go-package: ./...

  openapi-validation:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Validate gateway API contract
        run: make validate-openapi

  observability-configuration:
    name: Observability configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate dashboard and Prometheus configuration
        run: make observability-check

  demo-smoke:
    name: Demo smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start root demo stack
        run: ./scripts/ensure-demo-credentials.sh && docker compose up -d --build postgres migrate mock-bank-postgres mock-bank payment-gateway prometheus

      - name: Verify gateway migrations completed
        run: test "$(docker inspect --format='{{.State.ExitCode}}' "$(docker compose ps -a -q migrate)")" = "0"

      - name: Verify Postgres is healthy
        run: docker compose exec -T postgres pg_isready -U payment_gateway -d payment_gateway

      - name: Verify Mock Bank is reachable
        run: curl --fail --show-error --silent http://127.0.0.1:8787/health

      - name: Verify gateway readiness
        run: |
          deadline=$(( $(date +%s) + 180 ))
          until curl --fail --show-error --silent --output /dev/null http://localhost:8080/readyz; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "gateway did not become ready within 180s"
              exit 1
            fi
            sleep 1
          done

      - name: Run public payment smoke path
        run: make demo-smoke
        env:
          BASE_URL: http://localhost:8080
          MOCK_BANK_BASE_URL: http://127.0.0.1:8787
          PROMETHEUS_BASE_URL: http://127.0.0.1:9090
          READY_TIMEOUT_SECONDS: "180"

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --no-color postgres migrate mock-bank-postgres mock-bank payment-gateway prometheus

      - name: Stop root demo stack
        if: always()
        run: docker compose down --volumes

  demo-tls-smoke:
    name: TLS demo smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start opt-in TLS demo stack
        run: ./scripts/ensure-demo-credentials.sh && docker compose -f compose.yaml -f compose.tls-demo.yaml up -d --build

      - name: Run TLS edge smoke path
        run: make demo-tls-smoke
        env:
          PROMETHEUS_BASE_URL: http://127.0.0.1:9090
          READY_TIMEOUT_SECONDS: "180"

      - name: Show TLS demo logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.tls-demo.yaml logs --no-color postgres migrate mock-bank-postgres mock-bank payment-gateway caddy prometheus

      - name: Stop opt-in TLS demo stack
        if: always()
        run: docker compose -f compose.yaml -f compose.tls-demo.yaml down --volumes

  production-image-smoke:
    name: Production image smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and smoke test production image
        run: make image-smoke
